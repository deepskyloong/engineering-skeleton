name: gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.13.1
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python tools/gate.py
