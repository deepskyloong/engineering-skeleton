[project]
name = "<project-name>"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.9", "pytest>=8.0"]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
