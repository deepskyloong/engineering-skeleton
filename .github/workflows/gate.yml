name: gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Every stage but the prose one. That stage runs md-tools out of the python-toolkit
      # checkout named by MD_TOOLS_PROJECT, which CI cannot reach; the omission is named
      # here and in the pass line of `bun run gate:ci` (ADR-0025).
      - run: bun run gate:ci
